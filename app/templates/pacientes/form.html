{% extends "base.html" %}
{% block contenido %}
<h2>{{ 'Editar' if paciente else 'Nuevo' }} paciente</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" name="nombre" class="form-control" required value="{{ paciente.nombre if paciente else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Teléfono</label>
    <input type="text" name="telefono" class="form-control" value="{{ paciente.telefono if paciente else '' }}">
  </div>
  <button class="btn btn-success">Guardar</button>
  <a href="{{ url_for('pacientes.lista') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
