<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}MediControl{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('index') }}">MediControl</a>
      <div class="navbar-nav">
        <a class="nav-link" href="{{ url_for('medicos.lista') }}">Médicos</a>
        <a class="nav-link" href="{{ url_for('pacientes.lista') }}">Pacientes</a>
        <a class="nav-link" href="{{ url_for('citas.lista') }}">Citas</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="alert alert-{{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    {% block contenido %}{% endblock %}
  </div>
</body>
</html>
