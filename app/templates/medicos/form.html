{% extends "base.html" %}
{% block contenido %}
<h2>{{ 'Editar' if medico else 'Nuevo' }} médico</h2>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" name="nombre" class="form-control" required value="{{ medico.nombre if medico else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Especialidad</label>
    <input type="text" name="especialidad" class="form-control" required value="{{ medico.especialidad if medico else '' }}">
  </div>
  <button class="btn btn-success">Guardar</button>
  <a href="{{ url_for('medicos.lista') }}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
